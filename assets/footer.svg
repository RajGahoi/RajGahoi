<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 90" width="1600" height="90" fill="none">
<defs>
  <linearGradient id="ft-bg" x1="0" y1="0" x2="1600" y2="90" gradientUnits="userSpaceOnUse">
    <stop stop-color="#050814"/>
    <stop offset="0.5" stop-color="#0a0f24"/>
    <stop offset="1" stop-color="#080718"/>
  </linearGradient>

  <linearGradient id="ft-rule" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#050814" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#3B82F6" stop-opacity="0.6"/>
    <stop offset="50%"  stop-color="#8B5CF6" stop-opacity="0.9"/>
    <stop offset="75%"  stop-color="#EC4899" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#080718" stop-opacity="0"/>
  </linearGradient>

  <filter id="ft-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>

<rect width="1600" height="90" rx="16" fill="url(#ft-bg)"/>
<rect x="1" y="1" width="1598" height="88" rx="15" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-opacity="0.7"/>

<!-- Top Glowing Rule -->
<rect x="80" y="16" width="1440" height="1.5" fill="url(#ft-rule)" filter="url(#ft-glow)"/>

<!-- Center Animated Orbit -->
<ellipse cx="800" cy="54" rx="28" ry="16" fill="none" stroke="#8B5CF6" stroke-width="0.8" opacity="0.6">
  <animate attributeName="rx" values="28;34;28" dur="4s" repeatCount="indefinite"/>
</ellipse>
<circle r="2.5" fill="#38BDF8" opacity="0.95">
  <animateMotion dur="4s" repeatCount="indefinite">
    <mpath href="#ft-path"/>
  </animateMotion>
</circle>
<path id="ft-path" d="M 800 38 a 28 16 0 1 1 -0.1 0 Z" fill="none"/>

<!-- Mantra -->
<text x="800" y="60" text-anchor="middle"
  font-family="'JetBrains Mono', Consolas, monospace"
  font-size="14" font-weight="700" letter-spacing="10"
  fill="#E2E8F0" opacity="0.95">
  ENGINEER  <tspan fill="#38BDF8">·</tspan>  SCALE  <tspan fill="#EC4899">·</tspan>  DELIVER
</text>

<!-- Bottom Glowing Rule -->
<rect x="80" y="74" width="1440" height="1.5" fill="url(#ft-rule)" filter="url(#ft-glow)"/>
</svg>
